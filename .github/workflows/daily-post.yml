name: Daily Blog Post Generation

on:
  schedule:
    - cron: '0 7 * * 2,5'     # UTC 07:00 = KST 16:00, 화·금 주2회 — 구독 사용량 분산(2026-10-13)
  workflow_dispatch:          # 수동 실행 가능

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate post (attempt 1)
        id: attempt1
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLOG_ANTHROPIC_API_KEY: ${{ secrets.BLOG_ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: 지구촌 TMI
        run: npm run generate
      - name: Wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 120
      - name: Generate post (attempt 2 - retry)
        if: steps.attempt1.outcome == 'failure'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLOG_ANTHROPIC_API_KEY: ${{ secrets.BLOG_ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: 지구촌 TMI
        run: npm run generate
