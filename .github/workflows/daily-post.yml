# 2026-11-14 맥미니 launchd(com.aios.jigutmi)로 이전 — 이 워크플로는 수동 예비용
name: Daily Blog Post Generation

on:
  # 2026-11-11 cron 제거: GitHub 예약 실행이 3~8시간 밀려 검수관 재지시 칸을 먼저 써 버렸다.
  # 발행 시각은 컨트롤타워 채널등록부.json 발행일정(트리거: 검수관) — 검수관이 정시 직후 workflow_dispatch로 실행한다.
  workflow_dispatch:          # 수동 실행 가능

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate post (attempt 1)
        id: attempt1
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POST_STATUS: draft   # 검수관(컨트롤타워)이 검수 후 공개
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLOG_ANTHROPIC_API_KEY: ${{ secrets.BLOG_ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: 지구촌 TMI
        run: npm run generate
      - name: Wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 120
      - name: Generate post (attempt 2 - retry)
        if: steps.attempt1.outcome == 'failure'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POST_STATUS: draft   # 검수관(컨트롤타워)이 검수 후 공개
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLOG_ANTHROPIC_API_KEY: ${{ secrets.BLOG_ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: 지구촌 TMI
        run: npm run generate
